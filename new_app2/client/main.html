    <script>

        window.onload = () => {
            createTable(document.querySelector("#mainPageCdp>div>.productItemsTable1")).then(() => {
                decideProductItemsWidth(document.querySelector("#mainPageCdp>div>.productItemsTable1"), 16)
                addEventListener("resize", (event) => { decideProductItemsWidth(document.querySelector("#mainPageCdp>div>.productItemsTable1"), 16, 1) })
            })
        }

        function decideProductItemsWidth(container, rowGap, resizing) {
            let containerWidth = container.getBoundingClientRect().width
            let numberOfElements = Math.floor(containerWidth / (175))//hardcoded min-width D:

            if ((containerWidth - rowGap * (numberOfElements - 1)) / numberOfElements < 175) {
                numberOfElements -= 1
            }

            let itemWidth = (containerWidth - rowGap * (numberOfElements - 1)) / numberOfElements;
            Array.from(container.getElementsByClassName("product-item")).forEach((item) => {
                item.style.width = itemWidth + "px"
            })

            if (resizing) {
                if (container.scrollLeft != 0) {
                    container.scrollBy({
                        left: -(container.scrollLeft - container.getBoundingClientRect().width - 16),//including row gap
                        behavior: 'instant'
                    })
                }
                console.log(container.scrollLeft)
            }
        }

        //document.getElementById("kiidw").parentElement
